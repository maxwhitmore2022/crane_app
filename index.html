<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower Crane Challenge</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eef2f6;
      --panel: #ffffff;
      --panel-2: #f6f8fa;
      --ink: #172033;
      --muted: #667085;
      --line: #d7dde7;
      --yellow: #ffd21f;
      --yellow-dark: #d69c00;
      --blue: #4a70b5;
      --green: #2aa876;
      --red: #dc4c5a;
      --sky: #dff3fb;
      --ground: #d9c6a4;
      --building: #9ba8b6;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --page: #111827;
      --panel: #1c2535;
      --panel-2: #242f43;
      --ink: #f4f7fb;
      --muted: #b6c0d1;
      --line: #39465a;
      --yellow: #f2c84b;
      --yellow-dark: #be8b19;
      --blue: #83a8df;
      --green: #67d2a5;
      --red: #ff7a87;
      --sky: #1b3550;
      --ground: #66583f;
      --building: #708197;
    }

    [data-theme="dark"] {
      --ink: #ffffff;
    }

    [data-theme="dark"] .panel,
    [data-theme="dark"] .status,
    [data-theme="dark"] .topbar,
    [data-theme="dark"] .theme-toggle,
    [data-theme="dark"] .control {
      color: #ffffff;
    }

    [data-theme="dark"] .muted,
    [data-theme="dark"] .status label {
      color: #d8e1ef;
    }

    [data-theme="dark"] #night-stars,
    [data-theme="dark"] #night-moon {
      opacity: 1;
    }

    [data-theme="dark"] #day-sun,
    [data-theme="dark"] #day-clouds {
      opacity: 0;
    }

    #night-stars,
    #night-moon {
      opacity: 0;
    }

    #day-sun,
    #day-clouds {
      opacity: 1;
    }

    [data-theme="dark"] .scene text {
      fill: #ffffff;
    }

    [data-theme="dark"] #crane-cable {
      stroke: #ffffff;
    }

    #delivery-targets rect {
      transition: stroke 120ms ease, stroke-width 120ms ease, filter 120ms ease;
    }

    #delivery-targets rect.drop-ready {
      stroke: #ffef57;
      stroke-width: 7;
      filter: drop-shadow(0 0 8px #ffd21f);
      animation: target-pulse 700ms ease-in-out infinite alternate;
    }

    @keyframes target-pulse {
      from { filter: drop-shadow(0 0 3px #ffd21f); }
      to { filter: drop-shadow(0 0 12px #fff49a); }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      padding: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 1500px;
      margin: 0 auto 12px;
    }

    .title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2vw, 1.65rem);
    }

    .title span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .theme-toggle .sun {
      color: #c58b00;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 12px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .game-column {
      min-width: 0;
      display: grid;
      gap: 12px;
    }

    .statusbar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }

    .status {
      min-width: 0;
      padding: 10px 12px;
      border-right: 1px solid var(--line);
    }

    .status:last-child { border-right: 0; }

    .status label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status strong {
      display: block;
      font-size: clamp(0.92rem, 1.5vw, 1.15rem);
      white-space: nowrap;
    }

    .status .good { color: var(--green); }
    .status .warn { color: #b56a00; }

    .scene {
      position: relative;
      min-height: 430px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }

    .scene svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 430px;
    }

    .side-panel {
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 12px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 0.78rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .load-table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    .load-table th,
    .load-table td {
      border-bottom: 1px solid var(--line);
      padding: 7px 5px;
      text-align: right;
    }

    .load-table th {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .load-table th:first-child,
    .load-table td:first-child { text-align: left; }

    .load-table tr.current {
      background: color-mix(in srgb, var(--yellow) 24%, transparent);
      font-weight: 900;
    }

    .chart-current {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding: 9px;
      border-radius: 8px;
      background: var(--panel-2);
      font-size: 0.78rem;
    }

    .controls {
      display: grid;
      gap: 8px;
    }

    .control-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .control {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--ink);
      box-shadow: 0 2px 0 var(--line);
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    .control:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .control.pressed {
      transform: translateY(1px);
      box-shadow: none;
      border-color: var(--yellow-dark);
      background: color-mix(in srgb, var(--yellow) 35%, var(--panel-2));
    }

    .control-wide {
      grid-column: 1 / -1;
      background: var(--yellow);
      color: #3f3400;
      border-color: var(--yellow-dark);
      font-weight: 900;
    }

    .key {
      display: inline-grid;
      min-width: 26px;
      height: 26px;
      place-items: center;
      margin-right: 5px;
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      border-radius: 5px;
      background: var(--panel);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .warning {
      margin: 0;
      border: 1px solid color-mix(in srgb, var(--green) 55%, var(--line));
      border-radius: 8px;
      background: color-mix(in srgb, var(--green) 10%, var(--panel));
      color: var(--ink);
      padding: 9px;
      font-size: 0.78rem;
      text-align: center;
    }

    .warning.bad {
      border-color: var(--red);
      background: color-mix(in srgb, var(--red) 12%, var(--panel));
    }

    .warning.good {
      border-color: var(--green);
      background: color-mix(in srgb, var(--green) 12%, var(--panel));
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 8px;
    }

    .level-dot {
      height: 7px;
      border-radius: 99px;
      background: var(--line);
    }

    .level-dot.active { background: var(--yellow-dark); }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .side-panel {
        grid-template-columns: 1fr 1fr;
      }
      .scene, .scene svg { min-height: 390px; }
    }

    @media (max-width: 650px) {
      .app { padding: 8px; }
      .topbar { margin-bottom: 8px; }
      .title span { display: none; }
      .layout, .game-column, .side-panel { gap: 8px; }
      .statusbar {
        grid-template-columns: repeat(3, 1fr);
      }
      .status {
        border-bottom: 1px solid var(--line);
      }
      .status:nth-child(3) { border-right: 0; }
      .status:nth-child(n+4) {
        border-bottom: 0;
        grid-column: span 1;
      }
      .status:last-child { grid-column: span 2; }
      .scene, .scene svg { min-height: 330px; }
      .side-panel { grid-template-columns: 1fr; }
      .panel { padding: 10px; }
      .controls { grid-template-columns: 1fr 1fr; }
      .controls .control-row { grid-template-columns: repeat(2, 1fr); }
      .controls .warning,
      .controls .levels { grid-column: 1 / -1; }
      .control { min-height: 52px; }
    }
  </style>
</head>
<body>
  <main class="app" data-theme="light">
    <header class="topbar">
      <div class="title">
        <h1>Tower Crane Challenge</h1>
        <span>Level 1 / 5</span>

        <span class="theme-label">Light mode</span>

    </header>

    <div class="layout">
      <section class="game-column" aria-label="Crane game area">
        <div class="statusbar" aria-label="Game status">
          <div class="status">

              <rect x="665" y="358" width="70" height="64" rx="3" fill="#d8edf4" stroke="#596879"/>
              <rect x="755" y="358" width="70" height="64" rx="3" fill="#d8edf4" stroke="#596879"/>
              <path d="M560 270L750 270M560 270L560 350M560 350L870 350M560 350L560 430" stroke="#dce4ec" stroke-width="8"/>

                <rect width="58" height="34" rx="4" fill="#e4edf4" stroke="#596879" stroke-width="4"/>
                <text x="29" y="22" fill="#26384b" font-size="12" text-anchor="middle" font-weight="900" stroke="none">6,000 lb</text>

        <section class="panel controls" aria-label="Crane controls">

            <button class="control" type="button" data-action="jib-left"><span class="key">←</span> Jib Left</button>
            <button class="control" type="button" data-action="jib-right"><span class="key">→</span> Jib Right</button>

                <th>Capacity</th>

                <td>13,000 lb</td>

                <td>9,000 lb</td>
              </tr>

        <section class="panel" aria-label="Level and crane status">
          <h2>Level progress</h2>

          <div class="levels" aria-label="Five level progress">
            <span class="level-dot active"></span>
            <span class="level-dot"></span>
            <span class="level-dot"></span>
            <span class="level-dot"></span>
            <span class="level-dot"></span>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const app = document.querySelector(".app");
    const toggle = document.querySelector(".theme-toggle");
    const label = document.querySelector(".theme-label");
    const icon = document.querySelector(".sun");

    toggle.addEventListener("click", () => {
      const dark = app.dataset.theme !== "dark";
      app.dataset.theme = dark ? "dark" : "light";
      label.textContent = dark ? "Dark mode" : "Light mode";
      icon.textContent = dark ? "🌙" : "☀";
      icon.classList.toggle("moon", dark);
      toggle.setAttribute(
        "aria-label",
        dark ? "Switch to light mode" : "Switch to dark mode"
      );
    });

    const craneState = {
      radius: 75,
      trolleyX: 613,
      hookY: 326,
      jibFacing: 1,
      turnAngle: 0,
      turnTarget: 0,
      carrying: null,
      windPhase: 0
    };

    const chart = [
      { radius: 50, capacity: 20000 },
      { radius: 75, capacity: 13000 },
      { radius: 100, capacity: 9000 },
      { radius: 125, capacity: 7000 },
      { radius: 150, capacity: 5500 }
    ];

    const stagedWeights = [4000, 6000, 8000, 10000];
    const stagedPositions = [146, 209, 272, 335];
    const stagedLoads = stagedWeights.map((weight, index) => ({
      id: `staged-load-${index}`,
      weight,
      startX: stagedPositions[index],
      available: true
    }));
    const deliveredTargets = new Set();

    const radiusStatus = document.querySelector("#radius-status");
    const chartRadius = document.querySelector("#chart-radius");
    const chartCapacity = document.querySelector("#chart-capacity");
    const capacityStatus = document.querySelector("#capacity-status");
    const trolleyBody = document.querySelector("#trolley-body");
    const wheelA = document.querySelector("#wheel-a");
    const wheelB = document.querySelector("#wheel-b");
    const craneCable = document.querySelector("#crane-cable");
    const craneHook = document.querySelector("#crane-hook");
    const loadBody = document.querySelector("#load-body");
    const loadLines = document.querySelector("#load-lines");
    const loadLabel = document.querySelector("#load-label");
    const craneTop = document.querySelector("#crane-top");
    const loadStatus = document.querySelector("#load-status");
    const gameMessage = document.querySelector("#game-message");

    const activeKeys = new Map();
    let animationFrame = null;
    let lastFrameTime = 0;

    function currentChartRow() {
      return chart.find((row) => craneState.radius <= row.radius) || chart[chart.length - 1];
    }

    function setSvgAttribute(element, attribute, value) {
      element.setAttribute(attribute, String(value));
    }

    function showGameMessage(title, detail, tone = "") {
      gameMessage.className = `warning${tone ? ` ${tone}` : ""}`;
      gameMessage.innerHTML = `<strong>${title}</strong><br>${detail}`;
    }

    function resetStagedLoad(load) {
      load.available = true;
      const element = document.querySelector(`#${load.id}`);
      if (element) element.style.display = "";
    }

    function randomizeStaging() {
      const shuffled = [...stagedWeights];
      for (let index = shuffled.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] =
          [shuffled[swapIndex], shuffled[index]];
      }
      stagedLoads.forEach((load, index) => {
        load.weight = shuffled[index];
        const element = document.querySelector(`#${load.id}`);
        if (element) {
          element.dataset.weight = String(load.weight);
          const label = element.querySelector("text");
          if (label) label.textContent = `${load.weight.toLocaleString()} lb`;
          resetStagedLoad(load);
        }
      });
    }

    function updateDeliveredTarget(targetId, weight) {
      const target = document.querySelector(`#${targetId}`);
      if (!target) return;
      target.setAttribute("fill", "#67d2a5");
      target.setAttribute("fill-opacity", ".75");
      target.dataset.deliveredWeight = String(weight);
    }

    function updateCrane() {
      const trolleyBase = 613;
      craneState.trolleyX = trolleyBase + (craneState.radius - 75) * 2.84;

      const trolleyWidth = 46;
      const trolleyCenter = craneState.trolleyX;
      craneState.windPhase += 0.025;
      const windSwing = Math.sin(craneState.windPhase) * 18;
      const cableCenter = trolleyCenter + windSwing;
      setSvgAttribute(trolleyBody, "x", trolleyCenter - trolleyWidth / 2);
      setSvgAttribute(wheelA, "cx", trolleyCenter - 12);
      setSvgAttribute(wheelB, "cx", trolleyCenter + 12);

      setSvgAttribute(craneCable, "x1", trolleyCenter);
      setSvgAttribute(craneCable, "x2", cableCenter);
      setSvgAttribute(craneCable, "y2", craneState.hookY);

      setSvgAttribute(craneHook, "x", cableCenter - 11);
      setSvgAttribute(craneHook, "y", craneState.hookY - 4);

      const loadTop = craneState.hookY + 14;
      setSvgAttribute(loadBody, "x", cableCenter - 35);
      setSvgAttribute(loadBody, "y", loadTop);
      setSvgAttribute(loadLines, "d",
        `M${cableCenter - 35} ${loadTop + 16}H${cableCenter + 35}` +
        `M${cableCenter - 35} ${loadTop + 36}H${cableCenter + 35}` +
        `M${cableCenter} ${loadTop}V${loadTop + 52}`
      );
      setSvgAttribute(loadLabel, "x", cableCenter);
      setSvgAttribute(loadLabel, "y", loadTop + 92);
      loadLabel.style.transformBox = "fill-box";
      loadLabel.style.transformOrigin = "center";
      loadLabel.style.transform =
        craneState.jibFacing < 0 ? "scaleX(-1)" : "scaleX(1)";

      const pivotX = 500;
      const pivotY = 95;
      const radians = craneState.turnAngle * Math.PI / 180;
      const scaleX = Math.cos(radians);
      craneTop.setAttribute(
        "transform",
        `translate(${pivotX} ${pivotY}) scale(${scaleX} 1) translate(${-pivotX} ${-pivotY})`
      );

      const carriedWeight = craneState.carrying
        ? craneState.carrying.weight
        : null;
      [loadBody, loadLines, loadLabel].forEach((element) => {
        element.style.display = carriedWeight ? "" : "none";
      });
      loadStatus.textContent = carriedWeight
        ? `${carriedWeight.toLocaleString()} lb`
        : "No load";
      if (carriedWeight) loadLabel.textContent = `${carriedWeight.toLocaleString()} lb`;

      if (carriedWeight) {
        const hookCenter = getHookCenter();
        const upperReady =
          !deliveredTargets.has("target-a1") &&
          Math.abs(hookCenter - 610) <= 38 &&
          craneState.hookY >= 278 &&
          craneState.hookY <= 342;
        const lowerReady =
          !deliveredTargets.has("target-a2") &&
          Math.abs(hookCenter - 700) <= 38 &&
          craneState.hookY >= 358 &&
          craneState.hookY <= 422;
        document.querySelector("#target-a1")?.classList.toggle("drop-ready", upperReady);
        document.querySelector("#target-a2")?.classList.toggle("drop-ready", lowerReady);
      } else {
        document.querySelector("#target-a1")?.classList.remove("drop-ready");
        document.querySelector("#target-a2")?.classList.remove("drop-ready");
      }

      const row = currentChartRow();
      radiusStatus.textContent = `${Math.round(craneState.radius)} ft`;
      chartRadius.textContent = `Current: ${Math.round(craneState.radius)} ft`;
      chartCapacity.textContent = `${row.capacity.toLocaleString()} lb`;
      capacityStatus.textContent = carriedWeight
        ? `${Math.round((carriedWeight / row.capacity) * 100)}% safe`
        : "No load";
      capacityStatus.className = currentChartRow().capacity === 5500 ? "warn" : "";

      document.querySelectorAll(".load-table tbody tr").forEach((tableRow) => {
        tableRow.classList.toggle(
          "current",
          Number(tableRow.dataset.chartRadius) === row.radius
        );
      });
    }

    function applyAction(action, amount) {
      switch (action) {
        case "trolley-in":
          craneState.radius = craneState.jibFacing < 0
            ? Math.min(150, craneState.radius + amount)
            : Math.max(50, craneState.radius - amount);
          break;
        case "trolley-out":
          craneState.radius = craneState.jibFacing < 0
            ? Math.max(50, craneState.radius - amount)
            : Math.min(150, craneState.radius + amount);
          break;
        case "hook-up":
          craneState.hookY = Math.max(250, craneState.hookY - amount * 2);
          break;
        case "hook-down":
          craneState.hookY = Math.min(400, craneState.hookY + amount * 2);
          break;
        case "jib-left":
          if (craneState.jibFacing !== -1) craneState.turnTarget = 180;
          craneState.jibFacing = -1;
          break;
        case "jib-right":
          if (craneState.jibFacing !== 1) craneState.turnTarget = 0;
          craneState.jibFacing = 1;
          break;
      }
      updateCrane();
    }

    function movementLoop(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;
      const elapsed = Math.min(32, timestamp - lastFrameTime);
      lastFrameTime = timestamp;
      let stillMoving = false;

      const difference = craneState.turnTarget - craneState.turnAngle;
      if (Math.abs(difference) > 0.5) {
        craneState.turnAngle += Math.sign(difference) * Math.min(
          Math.abs(difference),
          elapsed * 0.12
        );
        stillMoving = true;
        updateCrane();
      }

      activeKeys.forEach((pressed, action) => {
        if (pressed) {
          stillMoving = true;
          applyAction(action, elapsed * 0.07);
        }
      });

      if (stillMoving) {
        animationFrame = requestAnimationFrame(movementLoop);
      } else {
        animationFrame = null;
        lastFrameTime = 0;
      }
    }

    function startAction(action) {
      if (action === "pick-set") {
        handlePickSet();
        return;
      }
      activeKeys.set(action, true);
      applyAction(action, 1);
      if (!animationFrame) animationFrame = requestAnimationFrame(movementLoop);
    }

    function stopAction(action) {
      activeKeys.delete(action);
    }

    function getHookCenter() {
      const trolleyCenter = 613 + (craneState.radius - 75) * 2.84;
      const windSwing = Math.sin(craneState.windPhase) * 18;
      const rawHookCenter = trolleyCenter + windSwing;
      const pivotX = 500;
      const radians = craneState.turnAngle * Math.PI / 180;
      const scaleX = Math.cos(radians);
      return pivotX + (rawHookCenter - pivotX) * scaleX;
    }

    function handlePickSet() {
      const hookCenter = getHookCenter();

      if (!craneState.carrying) {
        if (craneState.hookY < 300) {
          showGameMessage("Hook too high", "Lower the hook to staging height.", "bad");
          return;
        }

        const load = stagedLoads.find((item) =>
          item.available &&
          Math.abs(hookCenter - item.startX) <= 36 &&
          craneState.hookY >= 300
        );

        if (!load) {
          showGameMessage("No load under hook", "Move the hook over a staging load.", "bad");
          return;
        }

        craneState.carrying = load;
        load.available = false;
        const element = document.querySelector(`#${load.id}`);
        if (element) element.style.display = "none";
        showGameMessage("Load attached", `${load.weight.toLocaleString()} lb suspended.`, "good");
        updateCrane();
        return;
      }

      const load = craneState.carrying;
      const targets = [
        { id: "target-a1", labelId: "A1", centerX: 610, yMin: 278, yMax: 342 },
        { id: "target-a2", labelId: "A2", centerX: 700, yMin: 358, yMax: 422 }
      ];
      const target = targets.find((item) =>
        !deliveredTargets.has(item.id) &&
        Math.abs(hookCenter - item.centerX) <= 38 &&
        craneState.hookY >= item.yMin &&
        craneState.hookY <= item.yMax
      );

      if (!target) {
        craneState.carrying = null;
        resetStagedLoad(load);
        showGameMessage("Load returned", "Placement missed or target was wrong.", "bad");
        updateCrane();
        return;
      }

      deliveredTargets.add(target.id);
      updateDeliveredTarget(target.id, load.weight);
      const targetLabel = document.querySelector(
        target.labelId === "A1" ? "#target-label-a1" : "#target-label-a2"
      );
      if (targetLabel) targetLabel.textContent = `${load.weight.toLocaleString()} lb`;
      craneState.carrying = null;
      showGameMessage("Load delivered", `${load.weight.toLocaleString()} lb placed at ${target.labelId}.`, "good");
      updateCrane();
    }

    const keyActions = {
      j: "trolley-in",
      l: "trolley-out",
      i: "hook-up",
      k: "hook-down",
      ArrowLeft: "jib-left",
      ArrowRight: "jib-right",
      Enter: "pick-set"
    };

    document.querySelectorAll("[data-action]").forEach((button) => {
      const action = button.dataset.action;
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture?.(event.pointerId);
        button.classList.add("pressed");
        startAction(action);
      });
      button.addEventListener("pointerup", () => {
        button.classList.remove("pressed");
        stopAction(action);
      });
      button.addEventListener("pointercancel", () => {
        button.classList.remove("pressed");
        stopAction(action);
      });
      button.addEventListener("pointerleave", (event) => {
        if (event.buttons === 0) {
          button.classList.remove("pressed");
          stopAction(action);
        }
      });
    });

    window.addEventListener("keydown", (event) => {
      const action = keyActions[event.key] || keyActions[event.key.toLowerCase()];
      if (!action) return;
      event.preventDefault();
      if (event.repeat && action === "pick-set") return;
      if (!activeKeys.has(action)) {
        const button = document.querySelector(`[data-action="${action}"]`);
        button?.classList.add("pressed");
        startAction(action);
      }
    });

    window.addEventListener("keyup", (event) => {
      const action = keyActions[event.key] || keyActions[event.key.toLowerCase()];
      if (!action) return;
      event.preventDefault();
      const button = document.querySelector(`[data-action="${action}"]`);
      button?.classList.remove("pressed");
      stopAction(action);
    });

    randomizeStaging();
    updateCrane();
    window.setInterval(() => updateCrane(), 50);
  </script>
</body>
</html>
